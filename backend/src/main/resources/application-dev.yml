spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sportapp_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:sportapp_user}
    password: ${DB_PASSWORD:sportapp_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
